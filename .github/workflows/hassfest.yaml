name: hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: hassfest validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master
