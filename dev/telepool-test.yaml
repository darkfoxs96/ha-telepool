title: TelePool Test
views:
  - title: Virtual pool
    path: pool
    icon: mdi:pool
    cards:
      - type: markdown
        content: |
          # Virtual pool
          All devices on this dashboard are **Demo** devices. They only control simulated states in Home Assistant.

          Set the water temperature manually with the slider. Select Heat on the thermostat and set a target above the current temperature to turn on the virtual heater. Raise the water temperature above the target to turn it off.
      - type: thermostat
        entity: climate.telepool_demo_thermostat
        name: Demo thermostat
        features:
          - type: climate-hvac-modes
            hvac_modes:
              - "off"
              - heat
      - type: entities
        title: Virtual equipment
        show_header_toggle: false
        entities:
          - entity: switch.telepool_demo_power
            name: Demo station power
            icon: mdi:power
          - entity: input_number.telepool_demo_temperature
            name: Water temperature
          - entity: switch.telepool_demo_heater
            name: Virtual heater
            icon: mdi:radiator
      - type: markdown
        content: |
          ## Connect to TelePool
          In the integration options, select **External pool thermostat** for temperature control and **External station power relay** for FU / power control. Then choose:

          - **External pool thermostat:** `climate.telepool_demo_thermostat`
          - **External station power relay:** `switch.telepool_demo_power`

          To test a shared-power pause, enable **External relay also powers the thermostat**. Change the queued target through the **TelePool Water thermostat**; the Demo source on this dashboard controls the simulated thermostat directly. After Demo power is turned on, the Demo thermostat reports its state after three seconds.

          The power switch simulates a power signal for TelePool and has no connection to Q3 or other physical devices. The simulation's water temperature changes only through the slider.
      - type: button
        name: Open TelePool settings
        icon: mdi:cog
        icon_height: 24px
        tap_action:
          action: navigate
          navigation_path: /config/integrations/integration/telepool
